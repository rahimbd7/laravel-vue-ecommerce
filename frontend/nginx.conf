server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed, immutable build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue Router history mode - fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional same-origin proxy to the Laravel API.
    # Only used when the SPA is built with VITE_API_URL=/api; with the default
    # http://localhost:8000/api the browser talks to the backend directly.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Files uploaded to the backend's public storage disk
    location /storage/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
