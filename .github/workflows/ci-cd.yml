name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Docker Hub configuration
  MY_DOCKER_USERNAME: ${{ secrets.MY_DOCKER_USERNAME }}
  DOCKERHUB_IMAGE: ${{ secrets.MY_DOCKER_USERNAME }}/laravel-vue-ecommerce

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend - Pest/PHPUnit tests (sqlite in-memory)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd, exif, bcmath, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          # Create .env for testing (fallback if .env.example doesn't exist)
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "APP_ENV=testing" > .env
            echo "APP_DEBUG=true" >> .env
            echo "APP_URL=http://localhost:8000" >> .env
            echo "DB_CONNECTION=sqlite" >> .env
            echo "DB_DATABASE=/tmp/database.sqlite" >> .env
            echo "SESSION_DRIVER=array" >> .env
            echo "CACHE_DRIVER=array" >> .env
          fi
          php artisan key:generate --force
          php artisan config:clear

      - name: Run tests
        run: composer test

  # ---------------------------------------------------------------------------
  # 2. Frontend - type-check + production build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (includes vue-tsc type-check)
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_PRODUCT_PRESET: ${{ secrets.VITE_CLOUDINARY_PRODUCT_PRESET }}
          VITE_CLOUDINARY_CATEGORY_PRESET: ${{ secrets.VITE_CLOUDINARY_CATEGORY_PRESET }}
          VITE_CLOUDINARY_PROFILE_PRESET: ${{ secrets.VITE_CLOUDINARY_PROFILE_PRESET }}

  # ---------------------------------------------------------------------------
  # 3. Docker - build, test, and publish to Docker Hub
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build & publish
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set Docker Hub image name
        run: echo "DOCKERHUB_IMAGE=${MY_DOCKER_USERNAME}/laravel-vue-ecommerce" >> "$GITHUB_ENV"
        env:
          MY_DOCKER_USERNAME: ${{ secrets.MY_DOCKER_USERNAME }}

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build backend frontend

      - name: Smoke test the full stack
        run: |
          docker compose up -d mysql backend frontend
          echo "Waiting for the backend to become healthy..."
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/categories >/dev/null 2>&1; then
              echo "Backend is up (attempt ${i})."
              break
            fi
            sleep 5
            if [ "$i" -eq 40 ]; then
              echo "Backend did not become healthy in time."
              docker compose logs backend mysql
              exit 1
            fi
          done

          echo "--- backend API response:"
          curl -fsS http://localhost:8000/api/categories | head -c 500
          echo

          echo "--- frontend response:"
          curl -fsS http://localhost:5173 | head -n 5

          docker compose down -v

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.MY_DOCKER_PASSWORD }}

      - name: Build and push images to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
        run: |
          # Build with Docker Hub tags
          docker compose build backend frontend

          # Get the actual image names from docker compose
          BACKEND_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "backend" | head -1)
          FRONTEND_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "frontend" | head -1)

          echo "Using backend image: $BACKEND_IMAGE"
          echo "Using frontend image: $FRONTEND_IMAGE"

          # Tag backend with backend- prefix
          docker tag "$BACKEND_IMAGE" \
            "${DOCKERHUB_IMAGE}:backend-${{ github.sha }}"

          # Tag frontend with frontend- prefix
          docker tag "$FRONTEND_IMAGE" \
            "${DOCKERHUB_IMAGE}:frontend-${{ github.sha }}"

          # Push with commit SHA tag
          docker push "${DOCKERHUB_IMAGE}:backend-${{ github.sha }}"
          docker push "${DOCKERHUB_IMAGE}:frontend-${{ github.sha }}"

          # Tag as latest and push
          docker tag "${DOCKERHUB_IMAGE}:backend-${{ github.sha }}" \
            "${DOCKERHUB_IMAGE}:backend-latest"
          docker tag "${DOCKERHUB_IMAGE}:frontend-${{ github.sha }}" \
            "${DOCKERHUB_IMAGE}:frontend-latest"

          # Push latest tags
          docker push "${DOCKERHUB_IMAGE}:backend-latest"
          docker push "${DOCKERHUB_IMAGE}:frontend-latest"